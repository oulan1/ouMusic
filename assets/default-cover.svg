<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141E"/>
      <stop offset="50%" stop-color="#0E0E16"/>
      <stop offset="100%" stop-color="#08080C"/>
    </linearGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="500" height="500" rx="36" fill="url(#bgGradient)"/>

  <!-- Subtle Vinyl Grooves -->
  <circle cx="250" cy="240" r="185" fill="none" stroke="#222232" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="250" cy="240" r="145" fill="none" stroke="#2A2A3D" stroke-width="1.5"/>
  <circle cx="250" cy="240" r="105" fill="none" stroke="#32324A" stroke-width="1"/>

  <!-- Glowing vinyl center disc -->
  <circle cx="250" cy="240" r="85" fill="#12121C" stroke="url(#neonGradient)" stroke-width="3" filter="url(#glow)"/>

  <!-- Elegant, Mathematically Perfect Beamed Musical Notes -->
  <g filter="url(#glow)">
    <!-- Left Note Head (Tilted Oval) -->
    <ellipse cx="205" cy="265" rx="22" ry="16" transform="rotate(-24 205 265)" fill="url(#neonGradient)"/>
    <!-- Right Note Head (Tilted Oval) -->
    <ellipse cx="275" cy="238" rx="22" ry="16" transform="rotate(-24 275 238)" fill="url(#neonGradient)"/>

    <!-- Left Stem -->
    <rect x="219" y="155" width="8" height="110" rx="4" fill="url(#neonGradient)"/>
    <!-- Right Stem -->
    <rect x="289" y="128" width="8" height="110" rx="4" fill="url(#neonGradient)"/>

    <!-- Primary Top Connecting Beam -->
    <path d="M219 155 L297 128 L297 148 L219 175 Z" fill="url(#neonGradient)"/>
    <!-- Secondary Lower Beam -->
    <path d="M219 184 L297 157 L297 172 L219 199 Z" fill="url(#neonGradient)"/>
  </g>

  <!-- Brand Typography -->
  <text x="250" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#F1F5F9" text-anchor="middle" letter-spacing="4">ouMusic</text>
  <text x="250" y="442" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle" letter-spacing="3">M-CORE ENGINE</text>
</svg>
